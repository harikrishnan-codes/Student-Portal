<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Access - EduPortal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="root.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .auth-container {
      min-height: calc(100vh - var(--header-height));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem var(--container-gutter);
    }
    .auth-card {
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-md);
    }
  </style>
</head>
<body>

  <header class="portal-header">
    <div class="container header-inner">
      <a href="index.html" class="brand-logo" aria-label="Student Portal Home">
        <span class="brand-icon">
          <i class="fa-solid fa-graduation-cap"></i>
        </span>
        <span>EduPortal</span>
      </a>
      <a href="index.html" class="btn btn-secondary"><i class="fa-solid fa-arrow-left"></i> Home</a>
    </div>
  </header>

  <main class="auth-container">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <span class="brand-icon" style="margin: 0 auto 0.75rem;">
          <i class="fa-solid fa-lock"></i>
        </span>
        <h1 style="font-size: 1.5rem; font-weight: 700;">Student Sign In</h1>
        <p style="color: var(--color-text-muted); font-size: 0.9rem;">Authenticate using university SSO credentials</p>
      </div>

      <form data-auto-clear="true">
        <div class="form-group">
          <label class="form-label">User Identification</label>
          <div style="position: relative;">
            <input type="text" class="form-input" placeholder="e.g. STU-2026-904" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div style="position: relative;">
            <input type="password" class="form-input" placeholder="••••••••••••" required />
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;"><i class="fa-solid fa-arrow-right-to-bracket"></i> Proceed to Dashboard</button>
      </form>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
