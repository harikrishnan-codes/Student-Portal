<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | EduPortal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="root.css" />
        <link rel="icon" href="./assets/logo.webp" />

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="error.css" />
</head>

<body class="error-page-body">

    <div class="error-ambient-blob blob-1"></div>
    <div class="error-ambient-blob blob-2"></div>
    <div class="error-ambient-blob blob-3"></div>

    <main class="error-wrapper">
        <div class="error-glass-card">
            <div class="error-top-nav">
                <a href="index.html" class="brand-logo" aria-label="Student Portal Home">
                    <img src="./assets/logo 1.webp" alt="logo" height="60px" width="150px">
                </a>

                <div class="error-badge">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span>Error Code 404</span>
                </div>
            </div>

            <div class="error-visual">
                <span class="error-digit">4</span>
                <div class="error-orbit-container">
                    <div class="error-pulse-ring ring-1"></div>
                    <div class="error-pulse-ring ring-2"></div>
                    <div class="error-compass-core">
                        <i class="fa-solid fa-compass error-floating-icon"></i>
                    </div>
                </div>
                <span class="error-digit">4</span>
            </div>

            <h1 class="error-heading">Academic Path Not Found</h1>
            <p class="error-message">
                The syllabus, course portal, or resource link you followed might have graduated, moved, or expired.
            </p>

            <div class="error-action-group">
                <button type="button" class="btn btn-secondary"
                    onclick="window.history.length > 1 ? window.history.back() : window.location.href='index.html'">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Go Back</span>
                </button>
                <a href="index.html" class="btn btn-primary">
                    <i class="fa-solid fa-house"></i>
                    <span>Return to Home</span>
                </a>
                <a href="contact.html" class="btn btn-secondary">
                    <i class="fa-solid fa-headset"></i>
                    <span>Contact Support</span>
                </a>
            </div>

            <div class="error-terminal-tip">
                <i class="fa-solid fa-shield-halved"></i>
                <span>EduPortal Directory Verification &bull; Session Safe</span>
            </div>
        </div>
    </main>

</body>

</html>
